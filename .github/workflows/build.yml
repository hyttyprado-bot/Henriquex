name: Gerar APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Gerar o app
        run: |
          ARQ=$(find . -name settings.gradle | head -n 1)
          if [ -z "$ARQ" ]; then
            echo "settings.gradle NAO ENCONTRADO. Arquivos no repositorio:"
            find . -maxdepth 4 -not -path './.git*'
            exit 1
          fi
          DIR=$(dirname "$ARQ")
          echo "Projeto encontrado em: $DIR"
          cd "$DIR"
          gradle assembleDebug --no-daemon --stacktrace
          mkdir -p "$GITHUB_WORKSPACE/saida"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/saida/"

      - uses: actions/upload-artifact@v4
        with:
          name: HELauncher-apk
          path: saida/app-debug.apk
